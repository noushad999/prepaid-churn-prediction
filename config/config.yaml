data:
  raw_path: 'data/raw/'
  processed_path: 'data/processed/'
  graph_path: 'data/graphs/'
  test_size: 0.2
  random_state: 42

preprocessing:
  correlation_threshold: 0.05
  sampling_strategy: 'ADASYN'
  categorical_encoding: 'label'
  numerical_scaling: 'standard'

model:
  ccp_net:
    embedding_dim: 128
    num_heads: 8
    lstm_hidden_dim: 256
    cnn_filters: [128, 256, 512]
    kernel_sizes: [3, 5, 7]
    dropout: 0.3

  gnn:
    hidden_channels: 128
    num_layers: 3
    conv_type: 'GCN' # Options: GCN, GAT, GraphSAGE
    heads: 4

  nlp:
    model_name: 'distilbert-base-uncased'
    max_length: 128
    sentiment_threshold: 0.5

training:
  batch_size: 64
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  early_stopping_patience: 15
  scheduler: 'CosineAnnealingLR'
  optimizer: 'AdamW'

mlflow:
  experiment_name: 'telecom_churn_prediction'
  tracking_uri: 'http://localhost:5000'
